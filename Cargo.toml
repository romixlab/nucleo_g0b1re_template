# Host workspace: the API crate, the client library, the command line and the Python wrapper. The firmware
# (firmware/) is a standalone crate for thumbv6m-none-eabi: build it from its own directory (or `just run`).
[workspace]
resolver = "3"
members = ["nucleo_g0b1re_api", "nucleo_g0b1re_client", "nucleo_g0b1re_cli", "nucleo_g0b1re_py"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/vhrdtech/nucleo_g0b1re_template"

# just install: release, but incremental, so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true

[workspace.dependencies]
nucleo_g0b1re_api = { path = "nucleo_g0b1re_api", features = ["std"] }
nucleo_g0b1re_client = { path = "nucleo_g0b1re_client" }
# WireWeaver from git, the same source the firmware builds against (firmware/Cargo.toml)
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
wire_weaver_client = { git = "https://github.com/vhrdtech/wire_weaver", features = ["rtt"] }
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
ww_user_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["std"] }
# host crates
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
indicatif = "0.18"
pyo3 = "0.29"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
