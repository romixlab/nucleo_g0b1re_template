[package]
name = "nucleo_g0b1re_api"
version = "0.2.0"
edition = "2024"
description = "WireWeaver API of the nucleo_g0b1re firmware"

[features]
# owned (alloc) variants of the API types, for host-side users
std = [
    "wire_weaver/std",
    "ww_board_info/std",
    "ww_counters/std",
    "ww_dfu/std",
    "ww_firmware_info/std",
    "ww_log/std",
    "ww_uid/std",
    "ww_user_info/std",
]
defmt = ["wire_weaver/defmt", "ww_firmware_info/defmt", "ww_user_info/defmt", "dep:defmt"]

[dependencies]
defmt = { version = "1.1", optional = true }
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# the device contract (`device`): stdlib traits generic host tools know
# FirmwareInfo, LastReset; `std` reads every architecture's fault record
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["cortex-m"] }
ww_board_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_uid = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# UserInfo: the unit's name, kept in the firmware's settings store
ww_user_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_counters = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_log = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }

[dev-dependencies]
# the evolution check (tests/evolution.rs): this crate compared with its snapshots in api_snapshots/
wire_weaver_evolution = { git = "https://github.com/vhrdtech/wire_weaver" }
